name: Terminer la lisibilité du classeur scènes
on:
  push:
    branches: [continuation/scenes-livraison-20261116]
    paths: ['.github/workflows/apply-scenes-release.yml']
permissions:
  contents: write
concurrency:
  group: apply-parallaxe-scenes-release
  cancel-in-progress: false
jobs:
  reviewed-format:
    if: github.repository == 'darknigthmare/Parallaxe_Protocole9' && github.ref == 'refs/heads/continuation/scenes-livraison-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Restaurer l’export visuellement relu et vérifier les cellules
        run: |
          set -euo pipefail
          python3 .delivery/format-scenes.py
          python3 scripts/validate-open-workbook.py
          python3 scripts/validate-reprise-scenes-workbook.py
      - name: Enregistrer les deux fichiers de documentation contrôlés
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/continuation/scenes-livraison-20261116 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PARALLAXE_Suivi_Reprise_2026-11-16_Scenes.xlsx scripts/build-reprise-scenes-workbook.py
          git rm .delivery/format-scenes.py
          git commit -m 'docs: retain complete wrapped labels in the reviewed workbook metrics'
          git push origin HEAD:refs/heads/continuation/scenes-livraison-20261116
