name: Appliquer et vérifier les commandes accessibles

on:
  push:
    branches: [continuation/observations-20261110]
    paths: ['.github/workflows/apply-accessibility.yml']

permissions:
  contents: write

concurrency:
  group: apply-parallaxe-accessibility
  cancel-in-progress: false

jobs:
  apply-reviewed-lot:
    if: github.repository == 'darknigthmare/Parallaxe_Protocole9' && github.ref == 'refs/heads/continuation/observations-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restaurer les fichiers et cellules contrôlés par empreinte
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/accessibility-proof"
          git merge-base --is-ancestor a78c6511112ad55b4dc5bc31c35b7e89c304cc3a HEAD
          python3 .delivery/accessibility/apply.py | tee "$RUNNER_TEMP/accessibility-proof/restoration.json"
          python3 scripts/validate-open-workbook.py | tee "$RUNNER_TEMP/accessibility-proof/workbook.json"
          npm run test:accessibility 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/accessibility.log"
          npm run test:skills 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/skills.log"
          npm test > "$RUNNER_TEMP/accessibility-proof/domain.log" 2>&1
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Vérifier le typage et les régressions du jeu
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/typecheck.log"
          npm run test:scene 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/scene.log"
          npm run test:cabin 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/cabin.log"
          npm run test:inspection 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/inspection.log"
          npm run test:observation 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/observation.log"
          npm run test:acoustic 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/acoustic.log"
          npm run test:temporal 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/temporal.log"
          npm run test:lift 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/lift.log"
          npm run test:spoken 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/spoken.log"
          npm run test:shadow 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/shadow.log"
          npm run test:observatory 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/observatory.log"
          npm run test:radio 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/radio.log"
          npm run test:radio-ui 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/radio-ui.log"
          npm run test:radio-config 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/radio-config.log"
      - name: Compiler les deux éditions sans publier le site
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/hosted-build.log"
          npm run build:local 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/local-build.log"
      - name: Enregistrer les sources lisibles sur la branche de travail
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/continuation/observations-20261110 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md package.json app docs scripts src/game tests
          git rm -r .delivery/accessibility
          if git diff --cached --name-only | grep -q '^.github/'; then echo 'Unexpected workflow edit'; exit 1; fi
          git commit -m 'feat: add remappable keys, camera comfort and readable captions; preserve private evidence'
          git push origin HEAD:refs/heads/continuation/observations-20261110
          git rev-parse HEAD > "$RUNNER_TEMP/accessibility-proof/COMMIT.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/accessibility-proof/PARALLAXE_sources.tar.gz" HEAD
      - name: Construire et lancer le paquet de la révision exacte
        run: |
          set -euo pipefail
          npm run package:release 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/package.log"
          python3 tests/package-archive.test.py 2>&1 | tee "$RUNNER_TEMP/accessibility-proof/archive.log"
          cp outputs/release-v*/*.zip outputs/release-v*/release-manifest.json "$RUNNER_TEMP/accessibility-proof/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/accessibility-proof/
          if-no-files-found: error
          retention-days: 14
