name: Vérifier et appliquer les dossiers et parcours
on:
  push:
    branches: [continuation/dossiers-parcours-20261117]
    paths: ['.github/workflows/apply-records.yml']
permissions:
  contents: write
concurrency:
  group: apply-parallaxe-records
  cancel-in-progress: false
jobs:
  apply-reviewed-lot:
    if: github.repository == 'darknigthmare/Parallaxe_Protocole9' && github.ref == 'refs/heads/continuation/dossiers-parcours-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restaurer les fichiers relus sans toucher aux autres lots
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/records-proof"
          git merge-base --is-ancestor 5d56c3a894a7639537d3cde028185bbc9c60d883 HEAD
          python3 .delivery/records/apply.py | tee "$RUNNER_TEMP/records-proof/restoration.json"
          for validator in open reprise-scenes interruptions records; do
            python3 "scripts/validate-$validator-workbook.py" | tee "$RUNNER_TEMP/records-proof/workbook-$validator.json"
          done
      - run: npm ci
      - name: Vérifier le typage et les régressions complètes
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/records-proof/typecheck.log"
          npm test 2>&1 | tee "$RUNNER_TEMP/records-proof/domain.log"
          for suite in skills records downloads vercel workstreams accessibility interruptions scene cabin inspection observation acoustic temporal lift spoken shadow observatory radio radio-ui radio-config; do
            npm run "test:$suite" 2>&1 | tee "$RUNNER_TEMP/records-proof/$suite.log"
          done
      - name: Compiler les trois éditions
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/records-proof/hosted-build.log"
          npm run build:vercel 2>&1 | tee "$RUNNER_TEMP/records-proof/vercel-build.log"
          node tests/build-output.test.mjs vercel
          npm run build:local 2>&1 | tee "$RUNNER_TEMP/records-proof/local-build.log"
          node tests/build-output.test.mjs portable
      - name: Éprouver les interruptions puis les cinq lieux dans le vrai navigateur
        run: |
          set -euo pipefail
          npm run test:browser-runtime 2>&1 | tee "$RUNNER_TEMP/records-proof/browser-interruptions.log"
          npm run test:browser-records 2>&1 | tee "$RUNNER_TEMP/records-proof/browser-records.log"
      - name: Enregistrer les sources sur la branche de travail seulement
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/continuation/dossiers-parcours-20261117 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md package.json app docs scripts src/game standalone tests
          git rm -r .delivery/records
          if git diff --cached --name-only | grep -q '^.github/'; then exit 1; fi
          git commit -m 'feat: add five field dossiers, outcome debriefs and verified full multiplayer journeys'
          git push origin HEAD:refs/heads/continuation/dossiers-parcours-20261117
          git rev-parse HEAD > "$RUNNER_TEMP/records-proof/COMMIT.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/records-proof/PARALLAXE_sources.tar.gz" HEAD
      - name: Vérifier le paquet exact et ses parcours HTTP complets
        run: |
          set -euo pipefail
          npm run build:local
          node tests/build-output.test.mjs portable
          npm run package:release 2>&1 | tee "$RUNNER_TEMP/records-proof/package.log"
          python3 tests/package-archive.test.py 2>&1 | tee "$RUNNER_TEMP/records-proof/archive.log"
          cp outputs/release-v*/*.zip outputs/release-v*/release-manifest.json "$RUNNER_TEMP/records-proof/"
      - name: Conserver les captures et journaux de diagnostic
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/records-proof"
          for suite in interruptions records; do
            if test -d "outputs/browser-$suite"; then cp -r "outputs/browser-$suite" "$RUNNER_TEMP/records-proof/browser-$suite"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: records-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/records-proof/
          if-no-files-found: error
          retention-days: 14
