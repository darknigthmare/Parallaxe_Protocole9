name: Appliquer et vérifier les observations acoustiques
# Includes the focus/audio regression harness corrected after the first verification.
on:
  push:
    branches: [continuation/observations-20261110]
    paths: ['.github/workflows/apply-acoustique.yml']

permissions:
  contents: write

concurrency:
  group: parallaxe-apply-acoustique
  cancel-in-progress: false

jobs:
  apply-reviewed-lot:
    if: github.repository == 'darknigthmare/Parallaxe_Protocole9' && github.ref == 'refs/heads/continuation/observations-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restaurer les sources et le classeur contrôlés par empreinte
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acoustique-proof"
          git merge-base --is-ancestor 0a3ba7f8cb5d6182aa5a838471ebf2b9204f79dc HEAD
          python3 .delivery/acoustique/apply.py | tee "$RUNNER_TEMP/acoustique-proof/restoration.json"
          python3 scripts/validate-open-workbook.py | tee "$RUNNER_TEMP/acoustique-proof/workbook.json"
          npm test > "$RUNNER_TEMP/acoustique-proof/domain.log" 2>&1
          npm run test:acoustic > "$RUNNER_TEMP/acoustique-proof/acoustic.log" 2>&1
          node tests/radio-input.test.mjs > "$RUNNER_TEMP/acoustique-proof/focus.log" 2>&1
      - name: Installer uniquement les dépendances verrouillées
        run: npm ci
      - name: Vérifier TypeScript, les observations, la scène et les interfaces radio
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/acoustique-proof/typecheck.log"
          npm run test:scene 2>&1 | tee "$RUNNER_TEMP/acoustique-proof/scene.log"
          npm run test:observation 2>&1 | tee "$RUNNER_TEMP/acoustique-proof/observations.log"
          npm run test:cabin 2>&1 | tee "$RUNNER_TEMP/acoustique-proof/cabin.log"
          npm run test:inspection 2>&1 | tee "$RUNNER_TEMP/acoustique-proof/inspection.log"
          npm run test:radio 2>&1 | tee "$RUNNER_TEMP/acoustique-proof/radio.log"
          npm run test:radio-ui 2>&1 | tee "$RUNNER_TEMP/acoustique-proof/radio-ui.log"
          npm run test:radio-config 2>&1 | tee "$RUNNER_TEMP/acoustique-proof/radio-config.log"
      - name: Compiler les deux éditions sans publication du site
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/acoustique-proof/hosted-build.log"
          npm run build:local 2>&1 | tee "$RUNNER_TEMP/acoustique-proof/local-build.log"
      - name: Enregistrer les fichiers lisibles sur la branche de travail seulement
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/continuation/observations-20261110 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md package.json app docs scripts src/game tests
          git rm -r .delivery/acoustique
          if git diff --cached --name-only | grep -q '^.github/'; then
            echo 'Unexpected workflow edit'; exit 1
          fi
          git commit -m 'feat: integrate 108 private anomalies with spatial sound, silent evidence and synchronized Excel'
          git push origin HEAD:refs/heads/continuation/observations-20261110
          git rev-parse HEAD | tee "$RUNNER_TEMP/acoustique-proof/COMMIT.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/acoustique-proof/PARALLAXE_sources.tar.gz" HEAD
      - name: Vérifier le paquet construit sur le commit exact
        run: |
          set -euo pipefail
          npm run package:release 2>&1 | tee "$RUNNER_TEMP/acoustique-proof/package.log"
          python3 tests/package-archive.test.py 2>&1 | tee "$RUNNER_TEMP/acoustique-proof/archive-test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acoustique-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/acoustique-proof/
          if-no-files-found: error
          retention-days: 14
