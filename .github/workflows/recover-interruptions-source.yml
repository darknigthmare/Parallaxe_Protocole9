name: Extraire le point de reprise interruptions
on:
  push:
    branches: [continuation/interruptions-20261116]
    paths: ['.github/workflows/recover-interruptions-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstituer uniquement le lot déjà enregistré
        run: |
          set -euo pipefail
          python3 .delivery/interruptions/apply.py
          python3 .delivery/interruptions/overlay.py
          mkdir -p "$RUNNER_TEMP/p9-recovery"
          git add app src/game tests scripts README.md package.json docs
          git archive --format=tar.gz --output="$RUNNER_TEMP/p9-recovery/PARALLAXE_interrupted_sources.tar.gz" "$(git write-tree)"
          git rev-parse HEAD > "$RUNNER_TEMP/p9-recovery/BASE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: p9-interrupted-source-${{ github.sha }}
          path: ${{ runner.temp }}/p9-recovery/
          retention-days: 14
          if-no-files-found: error
