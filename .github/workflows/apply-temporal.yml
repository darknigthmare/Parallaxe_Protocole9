name: Appliquer et vérifier les gestes temporels

on:
  push:
    branches: [continuation/observations-20261110]
    paths: ['.github/workflows/apply-temporal.yml']

permissions:
  contents: write

concurrency:
  group: apply-parallaxe-temporal
  cancel-in-progress: false

jobs:
  apply-reviewed-lot:
    if: github.repository == 'darknigthmare/Parallaxe_Protocole9' && github.ref == 'refs/heads/continuation/observations-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restaurer uniquement les fichiers contrôlés par empreinte
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/temporal-proof"
          git merge-base --is-ancestor e8ae289681dd37d9b7893b4cf8cb1370a58656bf HEAD
          python3 .delivery/temporal/apply.py | tee "$RUNNER_TEMP/temporal-proof/restoration.json"
          python3 .delivery/temporal/overlay.py | tee "$RUNNER_TEMP/temporal-proof/placement-correction.json"
          python3 scripts/validate-open-workbook.py | tee "$RUNNER_TEMP/temporal-proof/workbook.json"
          npm test > "$RUNNER_TEMP/temporal-proof/domain.log" 2>&1
          node tests/temporal-state.test.mjs > "$RUNNER_TEMP/temporal-proof/temporal-state.log" 2>&1
      - name: Installer uniquement les dépendances verrouillées
        run: |
          npm ci
          tar -czf "$RUNNER_TEMP/temporal-proof/geometry-deps.tgz" node_modules/three node_modules/typescript
      - name: Vérifier les objets, les gestes partagés, la scène et la radio
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/temporal-proof/typecheck.log"
          npm run test:temporal 2>&1 | tee "$RUNNER_TEMP/temporal-proof/temporal.log"
          npm run test:scene 2>&1 | tee "$RUNNER_TEMP/temporal-proof/scene.log"
          npm run test:observation 2>&1 | tee "$RUNNER_TEMP/temporal-proof/observations.log"
          npm run test:acoustic 2>&1 | tee "$RUNNER_TEMP/temporal-proof/acoustic.log"
          npm run test:cabin 2>&1 | tee "$RUNNER_TEMP/temporal-proof/cabin.log"
          npm run test:inspection 2>&1 | tee "$RUNNER_TEMP/temporal-proof/inspection.log"
          npm run test:radio 2>&1 | tee "$RUNNER_TEMP/temporal-proof/radio.log"
          npm run test:radio-ui 2>&1 | tee "$RUNNER_TEMP/temporal-proof/radio-ui.log"
          npm run test:radio-config 2>&1 | tee "$RUNNER_TEMP/temporal-proof/radio-config.log"
      - name: Compiler les deux éditions sans publier le site
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/temporal-proof/hosted-build.log"
          npm run build:local 2>&1 | tee "$RUNNER_TEMP/temporal-proof/local-build.log"
      - name: Enregistrer les sources lisibles sur la branche de travail
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/continuation/observations-20261110 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md package.json app/game.tsx docs scripts src/game tests
          git rm -r .delivery/temporal
          if git diff --cached --name-only | grep -q '^.github/'; then echo 'Unexpected workflow edit'; exit 1; fi
          git commit -m 'feat: integrate 112 anomalies with shared server gestures, private time effects and synchronized Excel'
          git push origin HEAD:refs/heads/continuation/observations-20261110
          git rev-parse HEAD > "$RUNNER_TEMP/temporal-proof/COMMIT.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/temporal-proof/PARALLAXE_sources.tar.gz" HEAD
      - name: Vérifier le paquet construit sur le commit exact
        run: |
          set -euo pipefail
          npm run package:release 2>&1 | tee "$RUNNER_TEMP/temporal-proof/package.log"
          python3 tests/package-archive.test.py 2>&1 | tee "$RUNNER_TEMP/temporal-proof/archive.log"
          cp outputs/release-v*/*.zip "$RUNNER_TEMP/temporal-proof/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporal-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/temporal-proof/
          if-no-files-found: error
          retention-days: 14
