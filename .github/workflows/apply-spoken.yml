name: Appliquer et vérifier les voix synthétiques privées

on:
  push:
    branches: [continuation/observations-20261110]
    paths: ['.github/workflows/apply-spoken.yml']

permissions:
  contents: write

concurrency:
  group: apply-parallaxe-spoken
  cancel-in-progress: false

jobs:
  apply-reviewed-lot:
    if: github.repository == 'darknigthmare/Parallaxe_Protocole9' && github.ref == 'refs/heads/continuation/observations-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restaurer seulement les sources et le classeur contrôlés par empreinte
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spoken-proof"
          git merge-base --is-ancestor b16609c9650e8812eac95b980bfc184feef1c621 HEAD
          python3 .delivery/spoken/apply.py | tee "$RUNNER_TEMP/spoken-proof/restoration.json"
      - name: Installer l’outillage de création audio seulement sur le runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak ffmpeg python3-numpy
          espeak --version | tee "$RUNNER_TEMP/spoken-proof/voice-engine.txt"
          espeak --version | grep -F '1.48.15'
      - name: Générer la banque française originale hors ligne
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/build-spoken-bank.py | tee "$RUNNER_TEMP/spoken-proof/voice-generation.json"
          cp docs/spoken-bank-manifest.json "$RUNNER_TEMP/spoken-proof/"
          python3 scripts/validate-open-workbook.py | tee "$RUNNER_TEMP/spoken-proof/workbook.json"
          npm test > "$RUNNER_TEMP/spoken-proof/domain.log" 2>&1
          node tests/spoken.test.mjs > "$RUNNER_TEMP/spoken-proof/spoken.log" 2>&1
      - name: Installer les dépendances du jeu sans changement de verrouillage
        run: npm ci
      - name: Vérifier TypeScript, la scène, les voix et toutes les régressions
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/spoken-proof/typecheck.log"
          npm run test:scene 2>&1 | tee "$RUNNER_TEMP/spoken-proof/scene.log"
          npm run test:spoken 2>&1 | tee "$RUNNER_TEMP/spoken-proof/spoken.log"
          npm run test:temporal 2>&1 | tee "$RUNNER_TEMP/spoken-proof/temporal.log"
          npm run test:lift 2>&1 | tee "$RUNNER_TEMP/spoken-proof/lift.log"
          npm run test:observation 2>&1 | tee "$RUNNER_TEMP/spoken-proof/observations.log"
          npm run test:acoustic 2>&1 | tee "$RUNNER_TEMP/spoken-proof/acoustic.log"
          npm run test:cabin 2>&1 | tee "$RUNNER_TEMP/spoken-proof/cabin.log"
          npm run test:inspection 2>&1 | tee "$RUNNER_TEMP/spoken-proof/inspection.log"
          npm run test:radio 2>&1 | tee "$RUNNER_TEMP/spoken-proof/radio.log"
          npm run test:radio-ui 2>&1 | tee "$RUNNER_TEMP/spoken-proof/radio-ui.log"
          npm run test:radio-config 2>&1 | tee "$RUNNER_TEMP/spoken-proof/radio-config.log"
      - name: Compiler les deux éditions sans publier le site
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/spoken-proof/hosted-build.log"
          npm run build:local 2>&1 | tee "$RUNNER_TEMP/spoken-proof/local-build.log"
      - name: Enregistrer les fichiers lisibles et supprimer le transfert temporaire
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/continuation/observations-20261110 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md package.json app docs scripts src/game tests
          git rm -r .delivery/spoken
          if git diff --cached --name-only | grep -q '^.github/'; then echo 'Unexpected workflow modification'; exit 1; fi
          git diff --exit-code HEAD -- package-lock.json
          git commit -m 'feat: integrate 117 anomalies with offline private voices and revocable name consent'
          git push origin HEAD:refs/heads/continuation/observations-20261110
          git rev-parse HEAD > "$RUNNER_TEMP/spoken-proof/COMMIT.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/spoken-proof/PARALLAXE_sources.tar.gz" HEAD
      - name: Construire et lancer le paquet depuis le commit exact
        run: |
          set -euo pipefail
          npm run package:release 2>&1 | tee "$RUNNER_TEMP/spoken-proof/package.log"
          python3 tests/package-archive.test.py 2>&1 | tee "$RUNNER_TEMP/spoken-proof/archive.log"
          cp outputs/release-v*/*.zip "$RUNNER_TEMP/spoken-proof/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spoken-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/spoken-proof/
          if-no-files-found: error
          retention-days: 14
