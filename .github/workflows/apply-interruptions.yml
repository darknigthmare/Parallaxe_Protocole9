name: Vérifier et appliquer les interruptions graphiques
on:
  push:
    branches: [continuation/interruptions-20261116]
    paths: ['.github/workflows/apply-interruptions.yml']
permissions:
  contents: write
concurrency:
  group: apply-parallaxe-interruptions
  cancel-in-progress: false
jobs:
  apply-reviewed-lot:
    if: github.repository == 'darknigthmare/Parallaxe_Protocole9' && github.ref == 'refs/heads/continuation/interruptions-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restaurer seulement les sources relues
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/interruptions-proof"
          git merge-base --is-ancestor 712e886d40350eef21d7b310d11cd2af2f972eea HEAD
          python3 .delivery/interruptions/apply.py | tee "$RUNNER_TEMP/interruptions-proof/restoration.json"
          python3 scripts/validate-open-workbook.py
          python3 scripts/validate-reprise-scenes-workbook.py
          python3 scripts/validate-interruptions-workbook.py
      - run: npm ci
      - name: Vérifier le typage et toutes les suites
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/interruptions-proof/typecheck.log"
          npm test 2>&1 | tee "$RUNNER_TEMP/interruptions-proof/domain.log"
          for suite in skills downloads vercel workstreams accessibility interruptions scene cabin inspection observation acoustic temporal lift spoken shadow observatory radio radio-ui radio-config; do
            npm run "test:$suite" 2>&1 | tee "$RUNNER_TEMP/interruptions-proof/$suite.log"
          done
      - name: Compiler les trois éditions
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/interruptions-proof/hosted-build.log"
          npm run build:vercel 2>&1 | tee "$RUNNER_TEMP/interruptions-proof/vercel-build.log"
          node tests/build-output.test.mjs vercel
          npm run build:local 2>&1 | tee "$RUNNER_TEMP/interruptions-proof/local-build.log"
          node tests/build-output.test.mjs portable
      - name: Éprouver le jeu compilé dans Chromium et WebGL logiciel
        run: |
          set -euo pipefail
          npm run test:browser-runtime 2>&1 | tee "$RUNNER_TEMP/interruptions-proof/browser.log"
      - name: Enregistrer le lot lisible sur sa branche seulement
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/continuation/interruptions-20261116 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app src/game tests scripts README.md package.json docs
          git rm -r .delivery/interruptions
          if git diff --cached --name-only | grep -q '^.github/'; then exit 1; fi
          git commit -m 'fix: pause safely on WebGL loss, restore environment and reject invalid touch gestures'
          git push origin HEAD:refs/heads/continuation/interruptions-20261116
          git rev-parse HEAD > "$RUNNER_TEMP/interruptions-proof/COMMIT.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/interruptions-proof/PARALLAXE_sources.tar.gz" HEAD
      - name: Refaire les identités et contrôler le paquet exact
        run: |
          set -euo pipefail
          npm run build:local
          node tests/build-output.test.mjs portable
          npm run test:browser-runtime 2>&1 | tee "$RUNNER_TEMP/interruptions-proof/browser-exact.log"
          npm run package:release 2>&1 | tee "$RUNNER_TEMP/interruptions-proof/package.log"
          python3 tests/package-archive.test.py 2>&1 | tee "$RUNNER_TEMP/interruptions-proof/archive.log"
          cp outputs/release-v*/*.zip outputs/release-v*/release-manifest.json "$RUNNER_TEMP/interruptions-proof/"
      - name: Conserver les preuves et captures
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/interruptions-proof"
          if test -d outputs/browser-interruptions; then cp -r outputs/browser-interruptions "$RUNNER_TEMP/interruptions-proof/browser"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interruptions-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/interruptions-proof/
          if-no-files-found: error
          retention-days: 14
