name: Vérifier PARALLAXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    name: Sources exactes et traçabilité de la révision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Archiver uniquement les fichiers suivis par Git
        run: |
          mkdir -p "$RUNNER_TEMP/parallaxe-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/parallaxe-source/PARALLAXE_sources.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/parallaxe-source/COMMIT.txt"
          cd "$RUNNER_TEMP/parallaxe-source"
          sha256sum PARALLAXE_sources.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parallaxe-source-${{ github.run_id }}
          path: ${{ runner.temp }}/parallaxe-source/
          if-no-files-found: error
          retention-days: 14
  game:
    name: Règles, scène, radio et édition portable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Vérifier TypeScript
        run: npx tsc --noEmit
      - name: Vérifier les règles et les projections privées
        run: npm test
      - name: Vérifier les géométries et les changements de lieu
        run: npm run test:scene
      - name: Vérifier la radio et les autorisations
        run: npm run test:radio
      - name: Vérifier l’annulation des actions de l’interface radio
        run: npm run test:radio-ui
      - name: Vérifier les adresses radio et les identifiants TURN
        run: npm run test:radio-config
      - name: Compiler l’édition indépendante
        run: npm run build:local
      - name: Exécuter deux clients contre le serveur portable
        run: node tests/portable.test.mjs
