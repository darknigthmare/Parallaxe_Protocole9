name: Récupérer et vérifier le lot observations

on:
  push:
    branches: [continuation/observations-20261110]
    paths: ['.github/workflows/recover-observations.yml']

permissions:
  contents: write

concurrency:
  group: recover-parallaxe-observations
  cancel-in-progress: false

jobs:
  restore-reviewed-files:
    if: github.repository == 'darknigthmare/Parallaxe_Protocole9' && github.ref == 'refs/heads/continuation/observations-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restaurer uniquement les fichiers contrôlés par empreinte
        run: |
          mkdir -p "$RUNNER_TEMP/observations-proof"
          git merge-base --is-ancestor a1774830149d485af800133f688e94b208940883 HEAD
          python3 .delivery/observations/materialize.py | tee "$RUNNER_TEMP/observations-proof/restoration.json"
          python3 scripts/validate-open-workbook.py | tee "$RUNNER_TEMP/observations-proof/workbook.json"
          npm test > "$RUNNER_TEMP/observations-proof/domain.log" 2>&1
          node tests/observation-state.test.mjs > "$RUNNER_TEMP/observations-proof/observation-state.log" 2>&1
      - name: Appliquer les fichiers lisibles sur la branche de travail seulement
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/continuation/observations-20261110 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md package.json app/game.tsx docs scripts src/game tests
          git rm -r .delivery/observations
          if git diff --cached --name-only | grep -q '^.github/'; then
            echo 'Unexpected workflow edit in the recovery commit'; exit 1
          fi
          git commit -m 'feat: recover 104 observations, fix private object pings and pause timing, synchronize current Excel'
          git push origin HEAD:refs/heads/continuation/observations-20261110
          git rev-parse HEAD | tee "$RUNNER_TEMP/observations-proof/COMMIT.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/observations-proof/PARALLAXE_sources.tar.gz" HEAD
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Contrôler le typage et les scènes Three.js
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/observations-proof/typecheck.log"
          npm run test:scene 2>&1 | tee "$RUNNER_TEMP/observations-proof/scene.log"
          npm run test:observation 2>&1 | tee "$RUNNER_TEMP/observations-proof/observations.log"
          npm run test:cabin 2>&1 | tee "$RUNNER_TEMP/observations-proof/cabin.log"
          npm run test:inspection 2>&1 | tee "$RUNNER_TEMP/observations-proof/inspection.log"
      - name: Vérifier la radio et compiler les deux éditions
        run: |
          set -o pipefail
          npm run test:radio 2>&1 | tee "$RUNNER_TEMP/observations-proof/radio.log"
          npm run test:radio-ui 2>&1 | tee "$RUNNER_TEMP/observations-proof/radio-ui.log"
          npm run test:radio-config 2>&1 | tee "$RUNNER_TEMP/observations-proof/radio-config.log"
          npm run build 2>&1 | tee "$RUNNER_TEMP/observations-proof/hosted-build.log"
          npm run build:local 2>&1 | tee "$RUNNER_TEMP/observations-proof/local-build.log"
          npm run package:release 2>&1 | tee "$RUNNER_TEMP/observations-proof/package.log"
          python3 tests/package-archive.test.py 2>&1 | tee "$RUNNER_TEMP/observations-proof/archive-test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observations-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/observations-proof/
          if-no-files-found: error
          retention-days: 14
