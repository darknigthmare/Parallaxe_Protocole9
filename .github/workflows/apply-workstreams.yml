name: Appliquer et vérifier les chantiers de jouabilité

on:
  push:
    branches: [continuation/observations-20261110]
    paths: ['.github/workflows/apply-workstreams.yml']

permissions:
  contents: write

concurrency:
  group: apply-parallaxe-workstreams
  cancel-in-progress: false

jobs:
  apply-reviewed-lot:
    if: github.repository == 'darknigthmare/Parallaxe_Protocole9' && github.ref == 'refs/heads/continuation/observations-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restaurer les sources contrôlées par empreinte
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workstreams-proof"
          git merge-base --is-ancestor a73add4b2cd56524f07f2034505deb44dbf8f5cf HEAD
          python3 .delivery/chantiers/apply.py | tee "$RUNNER_TEMP/workstreams-proof/restoration.json"
          python3 scripts/validate-open-workbook.py | tee "$RUNNER_TEMP/workstreams-proof/workbook.json"
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Vérifier les chantiers et les régressions
        run: |
          set -euo pipefail
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/typecheck.log"
          npm run test:skills 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/skills.log"
          npm test 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/domain.log"
          npm run test:workstreams 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/workstreams.log"
          npm run test:accessibility 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/accessibility.log"
          npm run test:scene 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/scene.log"
          npm run test:cabin 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/cabin.log"
          npm run test:inspection 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/inspection.log"
          npm run test:observation 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/observation.log"
          npm run test:acoustic 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/acoustic.log"
          npm run test:temporal 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/temporal.log"
          npm run test:lift 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/lift.log"
          npm run test:spoken 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/spoken.log"
          npm run test:shadow 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/shadow.log"
          npm run test:observatory 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/observatory.log"
          npm run test:radio 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/radio.log"
          npm run test:radio-ui 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/radio-ui.log"
          npm run test:radio-config 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/radio-config.log"
      - name: Compiler sans publier le site
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/hosted-build.log"
          npm run build:local 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/local-build.log"
      - name: Appliquer uniquement sur la branche de travail
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/continuation/observations-20261110 | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md package.json app docs scripts src/game tests
          git rm -r .delivery/chantiers
          if git diff --cached --name-only | grep -q '^.github/'; then echo 'Unexpected workflow edit'; exit 1; fi
          git commit -m 'feat: add neutral-gated controller menus, portable solo checkpoints and private-safe performance capture'
          git push origin HEAD:refs/heads/continuation/observations-20261110
          git rev-parse HEAD > "$RUNNER_TEMP/workstreams-proof/COMMIT.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/workstreams-proof/PARALLAXE_sources.tar.gz" HEAD
      - name: Construire et lancer le paquet du commit exact
        run: |
          set -euo pipefail
          npm run package:release 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/package.log"
          python3 tests/package-archive.test.py 2>&1 | tee "$RUNNER_TEMP/workstreams-proof/archive.log"
          cp outputs/release-v*/*.zip outputs/release-v*/release-manifest.json "$RUNNER_TEMP/workstreams-proof/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workstreams-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/workstreams-proof/
          if-no-files-found: error
          retention-days: 14
