name: Vérification du registre Excel

on:
  push:
    branches: [continuation/excel-ouverts-20261101]
    paths:
      - 'docs/parallaxe-open-work-20261101.json'
      - 'docs/PARALLAXE_Registre_Ouverts_2026-11-01.xlsx'
      - 'scripts/validate-open-workbook.py'
      - '.github/workflows/excel-registre.yml'
  pull_request:
    paths:
      - 'docs/parallaxe-open-work-20261101.json'
      - 'docs/PARALLAXE_Registre_Ouverts_2026-11-01.xlsx'
      - 'scripts/validate-open-workbook.py'
      - '.github/workflows/excel-registre.yml'

permissions:
  contents: read

jobs:
  controle-registre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrôler les sources et le classeur (lecture seule)
        run: python3 scripts/validate-open-workbook.py
