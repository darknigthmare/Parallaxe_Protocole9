name: Vérification des classeurs et de la conception

on:
  push:
    branches: [main, continuation/observations-20261110]
    paths:
      - 'docs/parallaxe-open-work-20261101.json'
      - 'docs/*.xlsx'
      - 'docs/anomalies-gap-*.json'
      - 'docs/ANOMALIES_RESTANTES_*.csv'
      - 'docs/anomalies-design.json'
      - 'docs/runtime-catalog.json'
      - 'scripts/build-design-workbook.mjs'
      - 'scripts/build-open-workbook.mjs'
      - 'scripts/build-current-workbook.py'
      - 'scripts/validate-open-workbook.py'
      - '.github/workflows/excel-registre.yml'
  pull_request:
    paths:
      - 'docs/parallaxe-open-work-20261101.json'
      - 'docs/*.xlsx'
      - 'docs/anomalies-gap-*.json'
      - 'docs/ANOMALIES_RESTANTES_*.csv'
      - 'docs/anomalies-design.json'
      - 'docs/runtime-catalog.json'
      - 'scripts/build-design-workbook.mjs'
      - 'scripts/build-open-workbook.mjs'
      - 'scripts/build-current-workbook.py'
      - 'scripts/validate-open-workbook.py'
      - '.github/workflows/excel-registre.yml'

permissions:
  contents: read

jobs:
  controle-registre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrôler les sources, le CSV et le classeur
        run: python3 scripts/validate-open-workbook.py
      - name: Vérifier la syntaxe des deux générateurs Excel
        run: |
          node --check scripts/build-design-workbook.mjs
          node --check scripts/build-open-workbook.mjs
